  <rect width="512" height="512" fill="#bff0cf" />
  <g transform="translate(96 96) scale(13.3333)" fill="none" stroke="#00210f"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 3v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3" />
    <path d="M9 12v9" />
    <path d="M17 3c-1.7 1.2-2.5 3-2.5 5.2 0 1.6.8 2.6 2.5 2.8V21" />
  </g>
</svg>
